<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102f4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Team Ranks">
  <title>Team Ranks</title>

  <link rel="icon" type="image/png" href="apple-touch-icon.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon.png?v=3">

  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f6fa;
      color: #102f4a;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 420px);
      padding: 32px;
      text-align: center;
      background: #fff;
      border: 1px solid #d6e0e9;
      border-radius: 22px;
      box-shadow: 0 18px 45px rgba(16, 47, 74, .12);
    }

    img {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      object-fit: cover;
    }

    h1 { margin: 20px 0 10px; font-size: 28px; }
    p { margin: 0 0 22px; font-size: 17px; line-height: 1.45; }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px 18px;
      background: #102f4a;
      color: #fff;
      font: inherit;
      font-size: 17px;
      font-weight: 750;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="apple-touch-icon.png?v=3" alt="Team Ranks icon">
    <h1>Team Ranks</h1>
    <p>Add this page to your Home Screen. After that, the new icon will open Team Ranks directly.</p>
    <button type="button" id="open-app">Open Team Ranks</button>
  </main>

  <script>
    const APP_URL = 'https://script.google.com/macros/s/AKfycbwfYzCExemBA0BdkGV8cUAG2BNdZspvkqQaCF1E1AxStedmb7MlrjsChpzusjCNAYdWqg/exec';
    const isHomeScreen = window.navigator.standalone === true ||
      window.matchMedia('(display-mode: standalone)').matches;

    function freshAppUrl() {
      return APP_URL + '?launch=' + Date.now();
    }

    document.getElementById('open-app').addEventListener('click', () => {
      window.location.href = freshAppUrl();
    });

    if (isHomeScreen) {
      window.location.replace(freshAppUrl());
    }
  </script>
</body>
</html>
