<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#001f52">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rams GM">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Rams Assistant GM</title>
  <link rel="icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root{--navy:#001f52;--blue:#003594;--yellow:#ffd100;--ink:#eef4ff;--muted:#b8c7e3}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 0,#0b4aa9 0,transparent 38%),linear-gradient(180deg,var(--navy),#020d21);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(430px,100%);padding:28px 24px;text-align:center;background:rgba(5,25,61,.88);border:1px solid rgba(255,255,255,.13);border-radius:22px;box-shadow:0 28px 80px rgba(0,0,0,.3)}
    .icon-shell{position:relative;width:116px;height:116px;margin:0 auto;border-radius:25px;background:linear-gradient(145deg,#003594,#001f52);box-shadow:0 14px 38px rgba(0,0,0,.35);overflow:hidden}
    .icon{position:relative;z-index:2;width:100%;height:100%;display:block;object-fit:cover}
    .icon-fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--yellow);font-size:34px;font-weight:900;letter-spacing:.04em}
    h1{margin:20px 0 7px;font-size:27px;letter-spacing:-.03em}
    .sub{margin:0;color:var(--muted);font-size:14px}
    .browser-link{display:inline-block;margin-top:24px;color:var(--yellow);font-size:12px;font-weight:800;text-decoration:none}
    .disclaimer{margin:18px 0 0;color:#8093b5;font-size:9px;line-height:1.4}
  </style>
</head>
<body>
  <main>
    <div class="icon-shell">
      <div class="icon-fallback" aria-hidden="true">LAR</div>
      <img class="icon" src="launcher-logo.png?v=1" alt="Rams Assistant GM icon" onerror="this.style.display='none'">
    </div>
    <h1>Rams Assistant GM</h1>
    <p class="sub">Front Office Command Center</p>
    <a class="browser-link" href="https://script.google.com/macros/s/AKfycbyXH_0KWJM_MSvFV2rQ-jqW4Y0MlZosXtyr3rX4bMTqFeuoSXfNB1JBBuSJq1wBpPL2CA/exec">Open Rams GM</a>
    <p class="disclaimer">Unofficial personal franchise tracker.</p>
  </main>
  <script>
    const APP_URL = 'https://script.google.com/macros/s/AKfycbyXH_0KWJM_MSvFV2rQ-jqW4Y0MlZosXtyr3rX4bMTqFeuoSXfNB1JBBuSJq1wBpPL2CA/exec';
    const installed = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (installed) window.location.replace(APP_URL);
  </script>
</body>
</html>
