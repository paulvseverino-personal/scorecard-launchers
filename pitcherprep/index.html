<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#25133f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pitcher Prep">
  <title>Pitcher Prep</title>

  <link rel="icon" type="image/png" href="apple-touch-icon.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon.png?v=3">

  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f2fa;
      color: #25133f;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 420px);
      padding: 32px;
      text-align: center;
      background: #fff;
      border: 1px solid #ded5ec;
      border-radius: 22px;
      box-shadow: 0 18px 45px rgba(37, 19, 63, .15);
    }

    img {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      object-fit: cover;
    }

    h1 { margin: 20px 0 10px; font-size: 28px; }
    p { margin: 0 0 22px; font-size: 17px; line-height: 1.45; }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px 18px;
      background: #25133f;
      color: #fff;
      font: inherit;
      font-size: 17px;
      font-weight: 750;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img id="launcher-logo"
      src="https://raw.githubusercontent.com/paulvseverino-personal/scorecard-launchers/main/pitcherprep/apple-touch-icon.png?v=4"
      alt="Pitcher Prep icon"
    >
    <h1>Pitcher Prep</h1>
    <p id="status">Opening Pitcher Prep…</p>
    <button type="button" id="open-app" hidden>Open Pitcher Prep</button>
  </main>

  <script>
    const APP_URL = 'https://script.google.com/macros/s/AKfycbyS4lVBcFLyUKL8nXodM2HFo8z50IJYdKQMyM0HjvbhFmrk0S1grALNRu_zcYkKLWzh/exec';

    function freshAppUrl() {
      return APP_URL + '?launch=' + Date.now();
    }

    document.getElementById('open-app').addEventListener('click', () => {
      window.location.href = freshAppUrl();
    });

    async function openPitcherPrep() {
      const logo = document.getElementById('launcher-logo');

      // Allow the launcher icon to load before redirecting.
      try {
        if (!logo.complete || logo.naturalWidth === 0) {
          await Promise.race([
            new Promise(resolve => {
              logo.addEventListener('load', resolve, { once: true });
              logo.addEventListener('error', resolve, { once: true });
            }),
            new Promise(resolve => setTimeout(resolve, 2500))
          ]);
        }

        if (logo.decode) {
          await logo.decode().catch(() => {});
        }
      } finally {
        await new Promise(resolve => setTimeout(resolve, 900));
        window.location.replace(freshAppUrl());
      }
    }

    // Automatically open the app from Safari bookmarks
    // and standalone Home Screen launches.
    openPitcherPrep();
  </script>
</body>
</html>
